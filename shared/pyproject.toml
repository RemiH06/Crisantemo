[project]
name = "crisantemo-shared"
version = "0.1.0"
description = "Extracción de features acústicas compartida entre training y backend de Crisantemo"
requires-python = ">=3.11"
dependencies = [
    "praat-parselmouth>=0.4.3",
    "librosa>=0.10.2",
    "numpy>=1.26",
    "soundfile>=0.12.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["acoustic_features*"]
